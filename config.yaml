# AIKORU — конфигурация прототипа

device: auto            # YOLOE и трекинг: auto | cuda | cpu
models_dir: models
default_language: ru    # ru | kk — язык фоновых предупреждений до первой команды

web:
  enabled: true                 # локальный интерфейс в браузере
  host: 127.0.0.1               # 0.0.0.0 — открыть для других устройств в сети
  port: 8765

camera:
  index: 0
  width: 640
  height: 480
  fps: 15                       # меньше кадров — меньше декодирования; камера может округлить

detector:
  weights: yoloe-11s-seg.pt     # скачивается ultralytics автоматически (маски не считаются)
  imgsz: 512                    # 640 — точнее вдали; 512 — на ~35% быстрее; 416 и меньше теряет крупные планы
  conf: 0.30
  backend: auto                 # трекер: auto (CPU → OpenVINO, если установлен) | torch | openvino
  # Частота фонового трекинга зависит от режима (см. motion):
  scan_interval_s: 0.3          # active: сцена меняется или человек идёт/поворачивается
  watch_interval_s: 1.0         # watch: что-то шевелится в части кадра (без motion — спокойная сцена)
  idle_interval_s: 5.0          # idle: движения нет; любое движение будит трекинг сразу
  active_hold_s: 3.0            # сколько секунд после изменения/движения держать режим
  tracker: bytetrack.yaml       # bytetrack.yaml | botsort.yaml (ultralytics)
  # Голос звучит только при изменениях: новый объект ближе ~4 м, новый/знакомый
  # человек, знакомый ушёл, опасность прямо по курсу.
  # Стандартные объекты (английские названия — словарь YOLOE text prompts)
  standard_classes:
    - person
    - car
    - bus
    - truck
    - bicycle
    - motorcycle
    - door
    - stairs
    - traffic light
    - crosswalk
    - pole
    - bench
    - chair
    - table
    - trash can
  # Объекты, о которых предупреждать как об опасности, если они близко и прямо
  danger_classes: [car, bus, truck, bicycle, motorcycle, stairs, pole]

motion:
  # MOG2 на кадре 160 px в потоке камеры (~1 мс): решает, как часто гонять YOLOE
  enabled: true
  width: 160
  local: 0.003                  # доля движущихся пикселей → watch и пробуждение из idle
  global: 0.15                  # движется почти весь кадр (камера) → active
  history: 300                  # кадров памяти фона MOG2
  var_threshold: 25             # чувствительность MOG2: ниже — чувствительнее к шуму

faces:
  enabled: true
  db: data/faces.json           # локальная база знакомых лиц (биометрия, не в git)
  threshold: 0.40               # косинусное сходство SFace (рекомендуемый минимум 0.363)
  retry_interval_s: 0.5         # как часто пробовать узнать лицо нового человека
  max_tries: 12                 # сколько попыток на один трек
  unknown_after_s: 2.0          # через сколько секунд объявлять «незнакомый человек»
  remember_samples: 3           # сколько кадров брать при «запомни»

objects:
  enabled: true
  db: data/objects.json         # личные предметы: визуальные эмбеддинги YOLOE (не в git)
  conf: 0.25                    # порог поиска по образцу
  remember_samples: 3           # сколько кадров брать при «запомни мои ключи»

vlm:
  # LFM2.5-VL-450M: ~0.9 ГБ, на CPU 1.5–3 с на ответ. Легче и хуже:
  # HuggingFaceTB/SmolVLM-256M-Instruct (path: smolvlm-256m), ~1 с, чаще ошибается
  repo: LiquidAI/LFM2.5-VL-450M
  revision: main
  path: lfm2.5-vl-450m           # локальная папка внутри models/
  device: auto                   # auto: GPU только при min_vram_gb, иначе CPU (fp32)
  min_vram_gb: 4
  image_tokens: 64               # 64 — быстро; 128–256 — больше деталей и мелкого текста
  max_new_tokens: 40

translator:
  repo: JustFrederik/nllb-200-distilled-600M-ct2-int8   # NLLB-200 600M, CTranslate2 int8
  path: nllb-200-600M-ct2-int8
  device: cpu                    # int8 на CPU: 0.1–0.3 с на фразу, VRAM остаётся для YOLOE

voice:
  # «ай кору», «әй көру», «а и кору» сводятся к одному написанию (voice._normalize),
  # отдельные варианты не нужны; лишние («икору») давали ложные срабатывания на «и кому»
  wake_words: ["айкору"]
  wake_threshold: 0.75           # нечёткое совпадение 0..1; ниже — чаще срабатывает, но и ложно тоже
  vosk_models:
    ru: vosk-model-small-ru-0.22
    kk: vosk-model-small-kz-0.42
  command_timeout_s: 6.0         # сколько ждать команду после слова активации
  silence_end_s: 0.8             # пауза, завершающая команду (Silero VAD)

tts:
  model: v5_cis_base_nostress    # Silero v5 CIS: один голос на ru и kk
  voice: zhadyra                 # -> kaz_zhadyra / ru_zhadyra
  sample_rate: 48000
