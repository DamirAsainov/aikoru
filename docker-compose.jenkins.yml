# Локальный Jenkins: docker compose -f docker-compose.jenkins.yml up -d  -> http://localhost:8080
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # сборка образов через docker хоста
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq docker.io >/dev/null &&
      /usr/bin/tini -- /usr/local/bin/jenkins.sh"
volumes:
  jenkins_home:
